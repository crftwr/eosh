[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eosh"
# version -> single-sourced from src/eosh/__init__.py's __version__. Bump it
# there, not here. readme -> README.pypi.md, generated on the fly by `make
# build` (scripts/gen_pypi_readme.py): README.md with its repo-relative link
# targets rewritten to version-tagged GitHub URLs, so they resolve on the PyPI
# page, which has no repository to resolve them against. Both resolve in
# [tool.setuptools.dynamic] below.
dynamic = ["version", "readme"]
description = "A lightweight but powerful terminal shell with rich TAB completion and context switching"
license = "MIT"
authors = [{ name = "craftware" }]
requires-python = ">=3.12"
keywords = ["shell", "terminal", "completion", "repl", "aws"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
# Core: standard library only.
dependencies = []

[project.optional-dependencies]
# One extra per add-on under addons/, named after it — the shell's "not
# installed" hint derives `eosh[<name>]` from the add-on's name alone.
# Without it, `enable("*")` skips the add-on (recorded in
# eosh.recipes.skipped_recipes) and loads everything else.
#   boto3   — every awsut API call
#   pexpect — `awsut sagemaker hyperpod` SSM sessions
awsut = ["boto3", "pexpect"]
dev = ["pytest>=8", "eosh[awsut]"]

[project.scripts]
eosh = "eosh.__main__:main"

# Bundled add-ons (addons/<name>/ → eosh_addons.<name>).  This is how
# `enable("<name>")` and `enable("*")` find them, in a wheel and in an
# editable install alike.  tests/addons/test_boundary.py checks every
# directory under addons/ has an entry here.
[project.entry-points."eosh.addons"]
awsut = "eosh_addons.awsut"

[project.urls]
Homepage = "https://github.com/crftwr/eosh"
Repository = "https://github.com/crftwr/eosh"
Issues = "https://github.com/crftwr/eosh/issues"

[tool.setuptools.dynamic]
# setuptools reads the literal out of the module's AST without importing it.
version = { attr = "eosh.__version__" }
# Generated by scripts/gen_pypi_readme.py (make build), gitignored, and
# tolerated when absent: a plain `pip install -e .` just gets an empty
# description in its local metadata. `twine check --strict` in `make build`
# keeps an empty description from ever reaching an upload.
readme = { file = ["README.pypi.md"], content-type = "text/markdown" }

# Packages are listed by setup.py: addons/ maps onto the eosh_addons
# namespace, which [tool.setuptools.packages.find] cannot express.

[tool.pytest.ini_options]
testpaths = ["tests"]
